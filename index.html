<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A calm study tracker: one tap to start, sessions that grow with you." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Stint</title>
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      try {
        var t = (JSON.parse(localStorage.getItem('study-tracker') || '{}').state || {}).settings
        t = t && t.theme
        if (!t || t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
